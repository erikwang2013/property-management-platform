# ============================================================
# 物业管理系统 — 日志轮转配置 (logrotate)
# Copyright (c) 2026 erik <erik@erik.xyz> — https://erik.xyz
#
# 覆盖:
#   - service/workerman.log           (workerman 运行日志)
#   - service/runtime/logs/*.log      (webman 按天应用日志 + stdout)
#   - admin/runtime/logs/*.log        (webman 按天应用日志 + stdout)
#
# 安装:  sudo cp scripts/logrotate.conf /etc/logrotate.d/property-management
# 测试:  sudo logrotate -d /etc/logrotate.d/property-management
# 手工跑: sudo logrotate -f /etc/logrotate.d/property-management
#
# 保留周期: 每日轮转 + 保留 30 份 = 约 30 天。
# copytruncate: webman/workerman 进程常驻持有日志句柄，必须用
# 拷贝+清空而非 rename，否则进程继续写旧文件。
# ============================================================

/home/wwwroot/property-management-platform/service/workerman.log
/home/wwwroot/property-management-platform/service/runtime/logs/*.log
/home/wwwroot/property-management-platform/admin/runtime/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d
}
