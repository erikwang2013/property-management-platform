  小筑 (Xiaozhu) — 物业管理系统项目宠物 / project mascot
  语言无关：不含可见文字，可被全部 13 种语言 README 直接引用。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 26 215 276" width="215" height="276"
     role="img" aria-labelledby="xzTitle xzDesc">
  <title id="xzTitle">小筑 · 楼宇管家 — 物业管理系统项目宠物</title>
  <desc id="xzDesc">An indigo apartment building mascot wearing an orange steward cap, holding a work-order clipboard.</desc>

  <defs>
    <linearGradient id="xzBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="xzHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="xzWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <style>
      .xz-float { animation: xzFloat 3.6s ease-in-out infinite; transform-origin: 140px 160px; }
      .xz-eyes  { animation: xzBlink 4.6s ease-in-out infinite; transform-origin: 140px 178px; }
      @keyframes xzFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes xzBlink { 0%,93%,100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }
      @media (prefers-reduced-motion: reduce) { .xz-float, .xz-eyes { animation: none } }
    </style>
  </defs>

  <!-- 落地投影（不随浮动位移） -->
  <ellipse cx="140" cy="282" rx="64" ry="8" fill="#4F46E5" opacity=".1"/>

  <g class="xz-float">
    <!-- 腿 -->
    <path d="M116 246v16" stroke="#3730A3" stroke-width="13" stroke-linecap="round"/>
    <path d="M164 246v16" stroke="#3730A3" stroke-width="13" stroke-linecap="round"/>
    <!-- 鞋 -->
    <rect x="99" y="256" width="34" height="18" rx="9" fill="#F59E0B"/>
    <rect x="147" y="256" width="34" height="18" rx="9" fill="#F59E0B"/>
    <rect x="104" y="259" width="24" height="5" rx="2.5" fill="#FBBF24"/>

    <!-- 楼体（身体） -->
    <rect x="86" y="76" width="108" height="170" rx="16" fill="url(#xzBody)"/>

    <!-- 楼层窗格 4×2：亮窗代表在管房源 -->
    <rect x="92"  y="94"  width="18" height="22" rx="4.5" fill="url(#xzWin)"/>
    <rect x="118" y="94"  width="18" height="22" rx="4.5" fill="#3730A3" opacity=".55"/>
    <rect x="144" y="94"  width="18" height="22" rx="4.5" fill="url(#xzWin)"/>
    <rect x="170" y="94"  width="18" height="22" rx="4.5" fill="url(#xzWin)"/>
    <rect x="92"  y="124" width="18" height="22" rx="4.5" fill="url(#xzWin)"/>
    <rect x="118" y="124" width="18" height="22" rx="4.5" fill="url(#xzWin)"/>
    <rect x="144" y="124" width="18" height="22" rx="4.5" fill="#3730A3" opacity=".55"/>
    <rect x="170" y="124" width="18" height="22" rx="4.5" fill="url(#xzWin)"/>

    <!-- 表情 -->
    <ellipse cx="99"  cy="192" rx="8.5" ry="5.5" fill="#FB7185" opacity=".42"/>
    <ellipse cx="181" cy="192" rx="8.5" ry="5.5" fill="#FB7185" opacity=".42"/>
    <g class="xz-eyes">
      <circle cx="118" cy="178" r="10.5" fill="#FFFFFF"/>
      <circle cx="162" cy="178" r="10.5" fill="#FFFFFF"/>
      <circle cx="120" cy="180" r="5.4" fill="#1E1B4B"/>
      <circle cx="164" cy="180" r="5.4" fill="#1E1B4B"/>
      <circle cx="117" cy="175.5" r="2" fill="#FFFFFF"/>
      <circle cx="161" cy="175.5" r="2" fill="#FFFFFF"/>
    </g>
    <path d="M129 192q11 12 22 0" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>

    <!-- 胸前工牌：已完成工单 -->
    <rect x="122" y="212" width="36" height="26" rx="9" fill="#FFFFFF" opacity=".95"/>
    <path d="M132.5 226l4.5 5 9.5-10.5" fill="none" stroke="#F59E0B" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 手臂 -->
    <path d="M90 172q-22 10-25 24" fill="none" stroke="#4338CA" stroke-width="15" stroke-linecap="round"/>
    <path d="M190 172q16 10 18 20" fill="none" stroke="#4338CA" stroke-width="15" stroke-linecap="round"/>

    <!-- 工单板 -->
    <rect x="32" y="160" width="52" height="68" rx="9" fill="#FFFFFF" stroke="#3730A3" stroke-width="2.5"/>
    <rect x="48" y="154" width="20" height="13" rx="4" fill="#F59E0B" stroke="#3730A3" stroke-width="2.5"/>
    <rect x="42" y="178" width="32" height="5" rx="2.5" fill="#C7D2FE"/>
    <rect x="42" y="190" width="24" height="5" rx="2.5" fill="#C7D2FE"/>
    <path d="M42 208l5 5 9-10" fill="none" stroke="#F59E0B" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="205" width="14" height="5" rx="2.5" fill="#FDE68A"/>

    <!-- 手 -->
    <circle cx="66" cy="197" r="10.5" fill="#FFFFFF" stroke="#3730A3" stroke-width="2.5"/>
    <circle cx="209" cy="194" r="10.5" fill="#FFFFFF" stroke="#3730A3" stroke-width="2.5"/>

    <!-- 管家帽 -->
    <rect x="106" y="36" width="68" height="32" rx="10" fill="url(#xzHat)"/>
    <rect x="100" y="58" width="80" height="12" rx="5" fill="#3730A3"/>
    <ellipse cx="140" cy="74" rx="46" ry="9" fill="#D97706"/>
    <circle cx="140" cy="50" r="10" fill="#FFFFFF" opacity=".92"/>
    <rect x="133" y="43" width="6" height="6" rx="1.5" fill="#4F46E5"/>
    <rect x="141" y="43" width="6" height="6" rx="1.5" fill="#4F46E5" opacity=".72"/>
    <rect x="133" y="51" width="6" height="6" rx="1.5" fill="#4F46E5" opacity=".72"/>
    <rect x="141" y="51" width="6" height="6" rx="1.5" fill="#4F46E5"/>
  </g>
</svg>
