services:
  nginx:
    image: nginx:1.27-alpine
    container_name: property-svc-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./public:/app/public:ro
      # 完整 server 块替换镜像自带 default server（docs/nginx-security.conf 只是参考片段，
      # 且 use headers-more 指令，官方 nginx 镜像无该模块）
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # webman 只实现 /health（200），/ 返回 404
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - property-svc
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-svc-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      # 绑定挂载而非命名卷: 容器内日志(workerman/webman)落盘到主机
      # ./runtime/logs，由主机 logrotate (scripts/logrotate.conf) 轮转
      - ./runtime:/app/runtime
    command: ["php", "start.php", "start"]
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8788/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - property-svc
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.0.36
    container_name: property-svc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?please set MYSQL_ROOT_PASSWORD in .env}
      # 库名/用户/密码默认派生自应用配置 DB_DATABASE/DB_USERNAME/DB_PASSWORD（单一真源，
      # 避免应用与容器两处密码不一致）；需要独立覆盖时再显式设置 MYSQL_* 键
      MYSQL_DATABASE: ${MYSQL_DATABASE:-${DB_DATABASE:-management}}
      MYSQL_USER: ${MYSQL_USER:-${DB_USERNAME:-property_svc_user}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:?please set DB_PASSWORD in .env}}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据卷为空时自动导入全量建库 SQL（与 scripts/deploy.sh 导入的是同一文件）
      - ../docs/install.sql:/docker-entrypoint-initdb.d/install.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - property-svc
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    container_name: property-svc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - property-svc
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # ============================================================
  # 监控 (Prometheus + Grafana + redis_exporter)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: property-svc-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - app
    networks:
      - property-svc
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: property-svc-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?please set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./deploy/monitoring/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - property-svc
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v0.69.1-alpine
    container_name: property-svc-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?please set REDIS_PASSWORD in .env}
    networks:
      - property-svc
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:


networks:
  property-svc:
    driver: bridge
