# 挂载路径: /etc/grafana/provisioning/dashboards/dashboards.yml
# dashboard JSON 目录: /var/lib/grafana/dashboards (compose 绑定挂载本目录)
# ============================================================

apiVersion: 1

providers:
  - name: property-service
    orgId: 1
    folder: Property Service
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
