global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # 业务端应用指标 (GET /metrics, webman 端口 8788)
  - job_name: property-service
    static_configs:
      - targets: ["app:8788"]
        labels:
          app: property-service


  # redis_exporter: 连接状态 redis_up
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
