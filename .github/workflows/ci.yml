name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check admin PHP syntax
        run: find admin/app admin/config -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check service PHP syntax
        run: find service/app service/config -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    needs: php-syntax

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: management
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring
          coverage: xdebug

      # 不加 --strict：webman 要求 autoload.psr-4 含空前缀 ""（框架从项目根解析类），
      # composer 对此固定告警「empty namespace prefix is a bad idea for performance」，
      # --strict 会把该告警升级为失败，导致校验恒不可通过。schema 校验仍然生效。
      - name: Validate composer.json
        run: cd admin && composer validate

      - name: Install dependencies
        run: cd admin && composer install --prefer-dist --no-progress --no-interaction

      # --abandoned=report：仍对安全漏洞告警失败，但「已废弃且无替代品」的传递依赖不再判失败。
      # 目前唯一命中为 doctrine/annotations（hg/apidoc 的传递依赖，composer 标注 Suggested Replacement: none），
      # 无法通过换包解决；composer audit 默认对它退出 2，会让安全审计步骤恒失败。
      - name: Audit dependencies
        run: cd admin && composer audit --abandoned=report

      - name: Setup environment
        run: cp admin/.env.example admin/.env

      - name: Detect test sources (Admin)
        id: test_sources_admin
        run: |
          if find admin/tests -name '*Test.php' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::admin/tests is empty in this tree; skipping Admin tests"
          fi

      - name: Run tests with coverage gate (min 1.7%)
        if: steps.test_sources_admin.outputs.present == 'true'
        # 实测基线 2.24%（xdebug 本地，2026-10-30，纯单元测试恢复后），门禁取实测向下留 0.5pt 缓冲；
        # 仅防"测试通过但零插桩"类回归，不追求覆盖率目标。
        run: |
          cd admin
          php vendor/bin/phpunit --coverage-clover clover.xml --no-progress
          php -r '
            $x = simplexml_load_file("clover.xml");
            $m = $x->project->metrics;
            $t = (int)$m["statements"]; $c = (int)$m["coveredstatements"];
            $p = $t > 0 ? $c / $t * 100 : 0;
            printf("statement coverage: %.1f%% (%d/%d)\n", $p, $c, $t);
            if ($p < 1.7) { fwrite(STDERR, "coverage gate failed: $p% < 1.7%\n"); exit(1); }
          '

  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: php-syntax

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: management
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring
          coverage: xdebug

      # 同 admin：去掉 --strict，理由见 admin 任务上的注释
      - name: Validate composer.json
        run: cd service && composer validate

      - name: Install dependencies
        run: cd service && composer install --prefer-dist --no-progress --no-interaction

      # 同 admin：--abandoned=report，理由见 admin 任务上的注释
      - name: Audit dependencies
        run: cd service && composer audit --abandoned=report

      - name: Setup environment
        # CI 的 redis 服务未设密码，而 .env.example 的 REDIS_PASSWORD 是生产占位值；
        # autoload 顺序修复后 config() 在 CI 真正生效，中间件/metrics 用例会真连 redis，
        # 带密码 AUTH 会打到无密码服务（RedisException + redis_up 0）。此处对齐为空。
        # （本机/生产按各自 .env 配置密码，不受影响。）
        run: |
          cp service/.env.example service/.env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' service/.env

      - name: Detect test sources (Service)
        id: test_sources_service
        run: |
          if find service/tests -name '*Test.php' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::service/tests is empty in this tree; skipping Service tests"
          fi

      - name: Run tests with coverage gate (min 3%)
        if: steps.test_sources_service.outputs.present == 'true'
        # 实测基线 3.12%（pcov 本地，2026-08-16），门禁取基线向下取整，仅防"测试通过但零插桩"类回归；CI xdebug 与 pcov 语句覆盖差异 <0.5pt，留 0.12pt 缓冲
        run: |
          cd service
          php vendor/bin/phpunit --coverage-clover clover.xml --no-progress
          php -r '
            $x = simplexml_load_file("clover.xml");
            $m = $x->project->metrics;
            $t = (int)$m["statements"]; $c = (int)$m["coveredstatements"];
            $p = $t > 0 ? $c / $t * 100 : 0;
            printf("statement coverage: %.1f%% (%d/%d)\n", $p, $c, $t);
            if ($p < 3) { fwrite(STDERR, "coverage gate failed: $p% < 3%\n"); exit(1); }
          '

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Analyze admin Flutter
        run: cd admin/apps/flutter && flutter pub get && flutter analyze

      - name: Analyze service Flutter
        run: cd apps/flutter && flutter pub get && flutter analyze

      - name: Test service Flutter
        run: cd apps/flutter && flutter test

  phpstan:
    name: PHPStan (Level 5)
    runs-on: ubuntu-latest
    needs: php-syntax

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring

      - name: Admin analysis
        run: cd admin && composer install --prefer-dist --no-progress --no-interaction && vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Service analysis
        run: cd service && composer install --prefer-dist --no-progress --no-interaction && vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  secrets-scan:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  monitoring-config:
    name: Monitoring Config Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate monitoring YAML syntax
        # CI 无应用/Prometheus 运行，脚本仅执行 YAML 语法校验（其余检查 SKIP 不计失败），坏 YAML 时 exit 1
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          bash scripts/verify_monitoring.sh
