name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check admin PHP syntax
        run: find admin/app admin/config -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check service PHP syntax
        run: find service/app service/config -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    needs: php-syntax

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: open_admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring
          coverage: xdebug

      - name: Validate composer.json
        run: cd admin && composer validate --strict

      - name: Install dependencies
        run: cd admin && composer install --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: cd admin && composer audit

      - name: Setup environment
        run: cp admin/.env.example admin/.env

      - name: Run tests with coverage gate (min 3%)
        # 实测基线 3.24%（pcov 本地，2026-08-16），门禁取基线向下取整，仅防"测试通过但零插桩"类回归；CI xdebug 与 pcov 语句覆盖差异 <0.5pt，留 0.24pt 缓冲
        run: |
          cd admin
          php vendor/bin/phpunit --coverage-clover clover.xml --no-progress
          php -r '
            $x = simplexml_load_file("clover.xml");
            $m = $x->project->metrics;
            $t = (int)$m["statements"]; $c = (int)$m["coveredstatements"];
            $p = $t > 0 ? $c / $t * 100 : 0;
            printf("statement coverage: %.1f%% (%d/%d)\n", $p, $c, $t);
            if ($p < 3) { fwrite(STDERR, "coverage gate failed: $p% < 3%\n"); exit(1); }
          '

  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: php-syntax

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: property_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring
          coverage: xdebug

      - name: Validate composer.json
        run: cd service && composer validate --strict

      - name: Install dependencies
        run: cd service && composer install --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: cd service && composer audit

      - name: Setup environment
        run: cp service/.env.example service/.env

      - name: Run tests with coverage gate (min 3%)
        # 实测基线 3.12%（pcov 本地，2026-08-16），门禁取基线向下取整，仅防"测试通过但零插桩"类回归；CI xdebug 与 pcov 语句覆盖差异 <0.5pt，留 0.12pt 缓冲
        run: |
          cd service
          php vendor/bin/phpunit --coverage-clover clover.xml --no-progress
          php -r '
            $x = simplexml_load_file("clover.xml");
            $m = $x->project->metrics;
            $t = (int)$m["statements"]; $c = (int)$m["coveredstatements"];
            $p = $t > 0 ? $c / $t * 100 : 0;
            printf("statement coverage: %.1f%% (%d/%d)\n", $p, $c, $t);
            if ($p < 3) { fwrite(STDERR, "coverage gate failed: $p% < 3%\n"); exit(1); }
          '

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Analyze admin Flutter
        run: cd admin/apps/flutter && flutter pub get && flutter analyze

      - name: Analyze service Flutter
        run: cd apps/flutter && flutter pub get && flutter analyze

  phpstan:
    name: PHPStan (Level 5)
    runs-on: ubuntu-latest
    needs: php-syntax

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, gd, mbstring

      - name: Admin analysis
        run: cd admin && composer install --prefer-dist --no-progress --no-interaction && vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Service analysis
        run: cd service && composer install --prefer-dist --no-progress --no-interaction && vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  secrets-scan:
    name: Gitleaks Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  monitoring-config:
    name: Monitoring Config Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate monitoring YAML syntax
        # CI 无应用/Prometheus 运行，脚本仅执行 YAML 语法校验（其余检查 SKIP 不计失败），坏 YAML 时 exit 1
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          bash scripts/verify_monitoring.sh
