<xz-data-table
  title="投诉列表"
  [columns]="columns"
  [filters]="filters"
  [load]="loader"
  [rowActions]="rowActions"
  [refreshToken]="refresh()"
/>

<xz-form-modal
  [(open)]="actionOpen"
  [title]="actionTitle()"
  [fields]="actionFields()"
  [values]="actionRow()"
  [submit]="actionSubmit"
  [onSaved]="onSaved"
/>

<!-- 详情：只读。投诉正文在此看全文（列表里只有标题），受理/回访记录也在这里 -->
<nz-drawer
  [nzVisible]="detailOpen()"
  nzTitle="投诉详情"
  [nzWidth]="520"
  (nzOnClose)="detailOpen.set(false)"
>
  <ng-container *nzDrawerContent>
    @if (detail(); as d) {
      <nz-descriptions [nzColumn]="1" nzBordered nzSize="small">
        <nz-descriptions-item nzTitle="标题">{{ d.title }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="内容">{{ d.content || '—' }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="状态">
          <nz-tag [nzColor]="statusTags[d.status]?.color || 'default'">
            {{ statusTags[d.status]?.text || statusText(d.status) }}
          </nz-tag>
        </nz-descriptions-item>
        <nz-descriptions-item nzTitle="受理说明">{{ d.handler_remark || '—' }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="回访记录">{{ d.visitor_remark || '—' }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="满意度">{{ d.satisfaction || '—' }}</nz-descriptions-item>
      </nz-descriptions>

      <!-- 时间线紧跟 Descriptions，中间不加小标题（React 抽屉同为 Descriptions → Timeline） -->
      <nz-timeline>
        @for (t of track(d); track t) {
          <nz-timeline-item>{{ t }}</nz-timeline-item>
        }
      </nz-timeline>
    } @else {
      <p class="xz-muted">暂无详情</p>
    }
  </ng-container>
</nz-drawer>
