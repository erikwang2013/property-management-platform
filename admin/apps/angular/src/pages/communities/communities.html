<xz-data-table
  title="小区列表"
  [columns]="columns"
  [filters]="filters"
  [load]="loader"
  [rowActions]="rowActions"
  [refreshToken]="refresh()"
>
  <button nz-button nzType="primary" (click)="create()">
    <nz-icon nzType="plus" />
    新建小区
  </button>
</xz-data-table>

<xz-form-modal
  [(open)]="formOpen"
  [title]="editing() ? '编辑小区' : '新建小区'"
  [fields]="fields"
  [values]="editing()"
  [submit]="submit"
  [onSaved]="onSaved"
/>
