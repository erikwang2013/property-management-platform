<xz-data-table
  title="用户列表"
  [columns]="columns"
  [filters]="filters"
  [load]="loader"
  [rowActions]="rowActions"
  [selectable]="true"
  [refreshToken]="refresh()"
  [(selected)]="selected"
>
  <button nz-button nzType="primary" (click)="create()">
    <nz-icon nzType="plus" />
    新建用户
  </button>
  <button nz-button (click)="batchStatus(1)">批量启用</button>
  <button nz-button (click)="batchStatus(0)">批量禁用</button>
</xz-data-table>

<xz-form-modal
  [(open)]="formOpen"
  [title]="editing() ? '编辑用户' : '新建用户'"
  [fields]="fields()"
  [values]="editing()"
  [submit]="submit"
  [onSaved]="onSaved"
/>
