# 生效: prometheus 启动时加载; 改后可用 --web.enable-lifecycle + curl -XPOST /-/reload
# ============================================================

groups:
  - name: open-admin
    rules:
      # 应用不可达 = 全站故障（当前所有请求 5xx）
      - alert: AppDown
        expr: up{job="open-admin"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "open-admin 应用不可达"
          description: "Prometheus 连续 5 分钟无法抓取 open-admin /metrics，服务疑似宕机"

      - alert: MysqlDown
        expr: open_admin_db_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 连接失败"
          description: "应用连续 2 分钟探测 MySQL 失败 (SELECT 1 异常)"

      - alert: RedisDown
        expr: open_admin_redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接失败"
          description: "应用连续 2 分钟探测 Redis 失败 (PING 异常)"

      # 5xx 比例过高（MetricsCollector 中间件按 code=all/5xx 累计，见 /metrics）
      - alert: Http5xxRatio
        expr: sum(rate(open_admin_http_requests_total{code="5xx"}[5m])) / sum(rate(open_admin_http_requests_total{code="all"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 比例超过 5%"
          description: "过去 5 分钟 5xx 请求占比持续超过 5%，接口可能批量报错"
