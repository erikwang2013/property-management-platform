# Nginx 站点配置 — 开放管理后台（Docker nginx 容器）
# Copyright (c) 2026 erik <erik@erik.xyz> — https://erik.xyz
#
# 挂载位置: /etc/nginx/conf.d/default.conf（替换镜像自带 default server）
# 宿主机参考: admin/docs/nginx-security.conf（server 块片段，含 headers-more 指令）
# ============================================================

# http 上下文指令：conf.d/*.conf 由主配置 include 在 http {} 内，可写在顶层
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    # --- 隐藏技术栈版本信息 ---
    server_tokens off;

    # --- 请求体大小限制（与后端 SecurityFilter 10MB 一致） ---
    client_max_body_size 10m;

    # --- 超时限制 ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # --- 限流（Nginx 层，与后端 RateLimit 互补） ---
    limit_req zone=api burst=10 nodelay;
    limit_conn perip 20;

    # --- 安全头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- 禁止访问敏感文件（.well-known 例外：security.txt 需要） ---
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
        deny all;
        return 404;
    }

    # --- 方法白名单（与后端 SecurityFilter 一致） ---
    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- 反向代理到 webman 应用容器（compose 服务名 app） ---
    location / {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
